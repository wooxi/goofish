services:
  goofish-erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goofish-erp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./public/uploads:/app/public/uploads
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./next.config.ts:/app/next.config.ts
      - ./package.json:/app/package.json
      - next_cache:/app/.next

volumes:
  next_cache:
